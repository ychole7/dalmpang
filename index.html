<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>닮팡</title>
<link rel="stylesheet" href="style.css">

</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="avatar"><img src="assets/images/mascot_top.png" alt="닮팡"></div>
    <div class="pill pill-heart">
      <span class="heartWrap">
        <img src="assets/images/icon_heart.png" alt="">
        <span id="heartsVal">5</span>
      </span>
      <span class="heartTimer" id="heartTimer">MAX</span>
      <span class="plus" id="heartPlus">+</span>
    </div>
    <div class="pill"><span class="ico"><img src="assets/images/icon_coin.png" alt=""></span><span id="coinsVal">0</span><span class="plus" id="coinPlus">+</span></div>
    <div class="pill"><span class="ico"><img src="assets/images/icon_star.png" alt=""></span><span id="starsVal">0</span></div>
    <div class="gearBtn" id="gearBtn"><img src="assets/images/icon_gear.png" alt="설정"></div>
  </div>

  <div class="statsRow">
    <div class="targetCard">
      <div class="targetBadge">목표 점수</div>
      <div class="targetBig" id="targetVal">0</div>
      <div class="barTrack"><div class="barFill" id="progressFill"></div><div class="barStar" id="barStar">⭐</div></div>
    </div>
    <div class="stageBadgeMini">STAGE<br><span id="stageNum">01</span></div>
    <div class="movesBadge">
      <div class="circle" id="movesVal">-</div>
      <div class="lbl">MOVES</div>
      <div class="movesStars" id="movesStars">☆☆☆</div>
      <div class="movesScore" id="movesScoreEcho">0</div>
    </div>
  </div>
  <span id="stageNameLbl" style="display:none;"></span>

  <div id="boardWrap">
    <div id="grid"></div>
    <svg id="lineLayer"></svg>
    <div class="popEffect" id="popEffect">
      <div class="popParticles" id="popParticles"></div>
      <div class="popText" id="popText"></div>
    </div>
  </div>

  <div class="powerRow">
    <div class="powerBtn" id="btnCandy"><img src="assets/images/powerup_candy.png" alt="사탕"><span class="cnt" id="cntCandy">3</span></div>
    <div class="powerBtn" id="btnBomb"><img src="assets/images/powerup_bomb.png" alt="폭탄"><span class="cnt" id="cntBomb">2</span></div>
    <div class="powerBtn" id="btnShuffle"><img src="assets/images/powerup_shuffle.png" alt="셔플"><span class="cnt" id="cntShuffle">2</span></div>
    <div class="powerBtn" id="btnRainbow"><img src="assets/images/powerup_rainbow.png" alt="무지개"><span class="cnt" id="cntRainbow">2</span></div>
  </div>

  <div class="bottomNav">
    <div class="navBtn" id="navShop"><div class="ico"><img src="assets/images/icon_shop.png" alt=""></div>상점</div>
    <div class="navBtn" id="navEvent"><div class="ico"><img src="assets/images/icon_event.png" alt=""></div>이벤트</div>
    <div class="navBtn home" id="navHome"><div class="ico"><img src="assets/images/icon_home.png" alt=""></div></div>
    <div class="navBtn" id="navRank"><div class="ico"><img src="assets/images/icon_rank.png" alt=""></div>랭킹</div>
    <div class="navBtn" id="navMail"><div class="ico"><img src="assets/images/icon_mail.png" alt=""></div>우편함</div>
  </div>

</div>

<div id="toast"></div>

<div class="overlay" id="clearOverlay">
  <div class="card">
    <img class="mascotPop" src="assets/images/mascot_win.png" alt="">
    <h2>스테이지 클리어!</h2>
    <div class="stars" id="clearStars">⭐⭐⭐</div>
    <p id="clearDesc"></p>
    <p class="bestLine" id="clearBestLine"></p>
    <button class="btn" id="nextStageBtn">다음 스테이지</button>
  </div>
</div>

<div class="overlay" id="failOverlay">
  <div class="card">
    <img class="mascotPop" src="assets/images/mascot_fail.png" alt="">
    <h2>이동 횟수 소진!</h2>
    <p id="failDesc"></p>
    <button class="btn secondary" id="giveUpBtn">그만하기</button>
    <button class="btn" id="retryBtn">하트 사용해서 재도전</button>
  </div>
</div>

<script src="game.js"></script>

</body>
</html>
